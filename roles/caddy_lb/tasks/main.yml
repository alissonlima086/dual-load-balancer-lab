---
- name: Alertar sobre exposicao de portas dos balanceadores caso nao seja loopback
  ansible.builtin.debug:
    msg: "AVISO: LB_BIND_IP esta definido como '{{ lb_bind_ip }}'. Portas publicadas no Docker ignoram o UFW e ficam expostas diretamente para a internet"
  when: lb_bind_ip != '127.0.0.1'

- name: Criar diretorios de configuracao para cada balanceador Caddy
  ansible.builtin.file:
    path: "{{ dir_dados }}/caddy/{{ item.nome }}"
    state: directory
    mode: "0755"
  loop: "{{ load_balancers }}"
  loop_control:
    label: "{{ item.nome }}"

- name: Gerar Caddyfile para cada balanceador
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ dir_dados }}/caddy/{{ lb.nome }}/Caddyfile"
    mode: "0644"
  loop: "{{ load_balancers }}"
  loop_control:
    loop_var: lb
    label: "{{ lb.nome }} (porta {{ lb.porta }})"
  notify: Recarregar Caddy

- name: Garantir containers Docker dos balanceadores Caddy
  community.docker.docker_container:
    name: "{{ lb.nome }}"
    hostname: "{{ lb.nome }}"
    image: "{{ imagens.caddy }}"
    restart_policy: unless-stopped
    network_mode: "{{ rede.nome }}"
    published_ports:
      - "{{ lb_bind_ip }}:{{ lb.porta }}:{{ lb.porta }}"
    volumes:
      - "{{ dir_dados }}/caddy/{{ lb.nome }}:/etc/caddy:ro"
    labels:
      projeto: "{{ projeto }}"
      camada: balanceamento
      lb: "{{ lb.nome }}"
    state: started
  loop: "{{ load_balancers }}"
  loop_control:
    loop_var: lb
    label: "{{ lb.nome }} -> {{ lb_bind_ip }}:{{ lb.porta }}"

- name: Aplicar recarregamento do Caddy caso Caddyfile tenha sido alterado
  ansible.builtin.meta: flush_handlers

- name: Aguardar portas dos balanceadores estarem abertas
  ansible.builtin.wait_for:
    host: "{{ lb_probe_ip }}"
    port: "{{ item.porta }}"
    state: started
    timeout: 15
  loop: "{{ load_balancers }}"
  loop_control:
    label: "{{ item.nome }} (:{{ item.porta }})"

- name: Validar resposta HTTP dos balanceadores Caddy
  ansible.builtin.uri:
    url: "http://{{ lb_probe_ip }}:{{ item.porta }}/"
    status_code: 200
  loop: "{{ load_balancers }}"
  loop_control:
    label: "{{ item.nome }} (:{{ item.porta }})"
  register: lb_check
  until: lb_check.status == 200
  retries: 5
  delay: 2
