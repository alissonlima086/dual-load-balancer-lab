---
all:
  children:
    vps:
      hosts:
        debian_vps:
          ansible_host: "{{ lookup('ansible.builtin.env', 'VPS_HOST') | default('127.0.0.1', true) }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'VPS_USER') | default('deploy', true) }}"
          ansible_port: "{{ (lookup('ansible.builtin.env', 'VPS_PORT') | default(22, true)) | int }}"
          ansible_connection: ssh
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
